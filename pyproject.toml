[project]
name = "volebni-analyza"
version = "0.1.0"
description = "Results of Czech municipal and parliamentary elections by council and precinct, with voter-flow estimates and written analyses"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "fastapi>=0.143.0",
    "geopandas>=1.1.0",
    "lxml>=5.4.0",
    "mcp>=2.3.0",
    "pandas>=2.2.3",
    "pillow>=12.3.0",
    "requests>=2.32.3",
    "uvicorn[standard]>=0.54.0",
]
