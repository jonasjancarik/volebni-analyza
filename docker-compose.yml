x-data: &data
  volumes:
    # Results and boundaries are not in Git; copy them next to this file
    - ./output:/app/output:ro
    - ./input:/app/input
    # Optional API key for the CARTO base maps of the original app
    - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro

services:
  # The new app: React frontend served by the API
  app:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${VOLBY_APP_PORT:-3023}:8600"
    environment:
      # Public address of the original app; shows a "Původní verze" link when set
      VOLBY_LEGACY_URL: ${VOLBY_LEGACY_URL:-}
      # output/ is read-only here, so computed voter flows go to their own volume
      VOLBY_CACHE_DIR: /app/cache
    volumes:
      - ./output:/app/output:ro
      - ./input:/app/input
      - flow-cache:/app/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8600/api/elections', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # The original Streamlit app, kept for comparison
  web:
    build:
      context: .
    restart: unless-stopped
    command: ["uv", "run", "--no-sync", "streamlit", "run", "streamlit_app.py",
              "--server.address", "0.0.0.0", "--server.port", "8501",
              "--server.headless", "true", "--browser.gatherUsageStats", "false"]
    ports:
      - "127.0.0.1:${VOLBY_PORT:-3022}:8501"
    <<: *data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  # Voter-flow estimates; safe to delete, they are computed again at start
  flow-cache:
